  </defs>
  <!-- tile -->
  <rect x="8" y="8" width="240" height="240" rx="52" fill="url(#bg)"/>
  <rect x="8.5" y="8.5" width="239" height="239" rx="51.5" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>
  <!-- folder -->
  <path d="M52 86 a12 12 0 0 1 12 -12 h38 l14 14 h76 a12 12 0 0 1 12 12 v84 a12 12 0 0 1 -12 12 h-128 a12 12 0 0 1 -12 -12 z"
