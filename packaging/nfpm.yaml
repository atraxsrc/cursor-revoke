# One description of the package; packaging/build.sh turns it into .deb, .rpm
# and Arch packages. build.sh sets VERSION and runs nfpm from dist/stage/, so
# every src below is relative to that staged tree.
name: cursor-revoke
arch: all
platform: linux
version: ${VERSION}
release: "1"
section: utils
priority: optional
maintainer: atraxsrc <92285717+atraxsrc@users.noreply.github.com>
vendor: atraxsrc
homepage: https://github.com/atraxsrc/cursor-revoke
license: MIT
description: |
  Audit and revoke Cursor agent access on Linux.
  An installer-style terminal UI in reverse: it shows every folder, "always
  allow" rule, MCP server and hook Cursor's agent has been given, lets you
  tick what to remove, and quarantines it instead of deleting so a run can
  be undone.
depends:
  - python3 (>= 3.8)
recommends:
  - libnotify-bin          # notify-send, for the scheduled audit's desktop notification
contents:
  - src: usr/bin/cursor-revoke
    dst: /usr/bin/cursor-revoke
    file_info:
      mode: 0755
  - src: usr/share/applications/cursor-revoke.desktop
    dst: /usr/share/applications/cursor-revoke.desktop
    file_info:
      mode: 0644
  - src: usr/share/icons/hicolor/scalable/apps/cursor-revoke.svg
    dst: /usr/share/icons/hicolor/scalable/apps/cursor-revoke.svg
    file_info:
      mode: 0644
  - src: usr/share/doc/cursor-revoke/README.md
    dst: /usr/share/doc/cursor-revoke/README.md
    file_info:
      mode: 0644
  - src: usr/share/doc/cursor-revoke/CHANGELOG.md
    dst: /usr/share/doc/cursor-revoke/CHANGELOG.md
    file_info:
      mode: 0644
  - src: usr/share/doc/cursor-revoke/LICENSE
    dst: /usr/share/doc/cursor-revoke/LICENSE
    file_info:
      mode: 0644
  - src: usr/share/doc/cursor-revoke/copyright
    dst: /usr/share/doc/cursor-revoke/copyright
    file_info:
      mode: 0644
  - src: usr/lib/systemd/user/cursor-revoke-audit.service
    dst: /usr/lib/systemd/user/cursor-revoke-audit.service
    file_info:
      mode: 0644
  - src: usr/lib/systemd/user/cursor-revoke-audit.timer
    dst: /usr/lib/systemd/user/cursor-revoke-audit.timer
    file_info:
      mode: 0644
overrides:
  rpm:
    depends:
      - python3 >= 3.8
    recommends:
      - libnotify
  archlinux:
    depends:
      - python
    recommends: []
